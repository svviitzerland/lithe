name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/app/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match @lithe/app $pkg"
            exit 1
          fi
          for p in core ssh cli; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$pkg" ] || { echo "@lithe/$p is $v, expected $pkg"; exit 1; }
          done

      # Order matters: each package depends on exact versions of what precedes it.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          for p in core ssh app cli; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            if [ "$DRY" = "true" ]; then
              echo "dry run: would publish $name@$version"
              (cd "packages/$p" && npm publish --dry-run --access public)
            else
              (cd "packages/$p" && npm publish --access public --provenance)
            fi
          done

  relay:
    name: relay binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: relay/go.sum
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="lithe-relay-${GOOS}-${GOARCH}"
          cd relay && go build -trimpath -ldflags="-s -w" -o "../$out" .
          cd .. && tar czf "$out.tar.gz" "$out"
      - uses: softprops/action-gh-release@v2
        with:
          files: lithe-relay-*.tar.gz
          generate_release_notes: true
