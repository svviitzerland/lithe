name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun test
      - name: build
        run: bun run build
      - name: packages are publishable
        run: |
          for p in core ssh app cli; do
            echo "::group::@lithe/$p"
            (cd "packages/$p" && npm pack --dry-run)
            echo "::endgroup::"
          done

  go:
    name: relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: relay/go.sum
      - name: vet
        run: cd relay && go vet ./...
      - name: test
        run: cd relay && go test -race ./...
      - name: build
        run: cd relay && go build -o /dev/null .
      - name: gofmt
        run: |
          cd relay
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd: $unformatted"
            exit 1
          fi

  e2e:
    name: ssh end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: relay/go.sum
      - run: bun install --frozen-lockfile
      - name: ssh into a serverless app
        run: ./scripts/e2e.sh

  e2e-ssh:
    name: ssh with no relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: a real ssh client against a TypeScript ssh server
        run: ./scripts/e2e-ssh.sh

  workers:
    name: cloudflare workers runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: the worker really boots on workerd
        run: ./scripts/check-worker.sh
